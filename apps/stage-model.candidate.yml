          "data": {
            "type": "code",
            "title": "当前模型六字段grant及完整任务要求",
            "desc": "",
            "selected": false,
            "code_language": "python3",
            "code": "\nimport json\nimport hashlib\nimport math\nimport re\nimport time\n\ndef strict_json(raw):\n    def reject_constant(value):\n        raise ValueError(\"NON_JSON_NUMBER\")\n    def unique_pairs(pairs):\n        result = {}\n        for key, value in pairs:\n            if key in result:\n                raise ValueError(\"DUPLICATE_JSON_KEY\")\n            result[key] = value\n        return result\n    if not isinstance(raw, str) or len(raw) > 200000:\n        raise ValueError(\"INVALID_JSON_INPUT\")\n    value = json.loads(raw, parse_constant=reject_constant, object_pairs_hook=unique_pairs)\n    if not isinstance(value, dict):\n        raise ValueError(\"JSON_OBJECT_REQUIRED\")\n    return value\n\ndef dump(value):\n    return json.dumps(value, ensure_ascii=False, allow_nan=False, separators=(\",\", \":\"))\n\ndef fail(code):\n    return {\"ready\": False, \"payload_json\": \"{}\", \"scope_ref\": \"\", \"proof\": \"\",\n            \"message\": \"BLOCKED: \" + code}\n\ndef business_response(status_code, body):\n    if not isinstance(status_code, (int, float)) or not 200 <= status_code < 300:\n        raise ValueError(\"HTTP_ERROR\")\n    value = strict_json(body)\n    if value.get(\"status\") != \"ready\" or not isinstance(value.get(\"data\"), dict):\n        raise ValueError(\"BUSINESS_NOT_READY\")\n    return value[\"data\"]\n\ndef reference_sets(bundle):\n    evidence = bundle.get(\"evidence\")\n    if not isinstance(evidence, dict):\n        raise ValueError(\"EVIDENCE_REQUIRED\")\n    groups = ((\"facts\", \"fact_id\"), (\"source_refs\", \"source_ref_id\"),\n              (\"business_rules\", \"business_rule_id\"))\n    result = []\n    for group, key in groups:\n        rows = evidence.get(group, [])\n        if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):\n            raise ValueError(\"INVALID_EVIDENCE_ROWS\")\n        ids = [row.get(key) for row in rows]\n        if any(not isinstance(ref, str) or not ref for ref in ids) or len(set(ids)) != len(ids):\n            raise ValueError(\"INVALID_EVIDENCE_IDS\")\n        result.append(set(ids))\n    return result\n\ndef safe_source_context(context, bundle):\n    # This is a restrictive disclosure/schema check on a response already\n    # received from the authenticated service, not independent IMA attestation.\n    # Its purpose is to preserve the selected-file receipt without leaking an\n    # arbitrary server object or expanding that receipt's authority.\n    if not isinstance(context, dict) or not isinstance(bundle, dict):\n        raise ValueError(\"SOURCE_CONTEXT_REQUIRED\")\n    mode = context.get(\"source_mode\")\n    if mode not in {\"local_snapshot\", \"hybrid_verified\"}:\n        raise ValueError(\"IMA_LIVE_SOURCE_NOT_IMPLEMENTED\")\n    if context.get(\"competition_eligible\") is not False:\n        raise ValueError(\"SOURCE_CANNOT_CLAIM_COMPETITION\")\n    for key in (\"source_context_ref\", \"source_snapshot_ref\"):\n        if not isinstance(context.get(key), str) or not re.fullmatch(r\"[A-Za-z0-9_][A-Za-z0-9_.:-]{0,255}\", context[key]):\n            raise ValueError(\"SOURCE_REFERENCE_INVALID\")\n    projected = {key: context[key] for key in (\"source_context_ref\", \"source_mode\", \"source_snapshot_ref\", \"competition_eligible\")}\n    evidence = bundle.get(\"evidence\")\n    if not isinstance(evidence, dict):\n        raise ValueError(\"EVIDENCE_REQUIRED\")\n    facts, refs = evidence.get(\"facts\"), evidence.get(\"source_refs\")\n    if not isinstance(facts, list) or not facts or not isinstance(refs, list) or not refs or any(not isinstance(row, dict) for row in facts + refs):\n        raise ValueError(\"SOURCE_ROWS_REQUIRED\")\n    provenance = \"selected_fact_file_original_hash_matched\"\n    if mode == \"local_snapshot\":\n        if context.get(\"ima_verification\") is not None or context.get(\"ima_provenance\") not in (None, \"unverified\"):\n            raise ValueError(\"LOCAL_SOURCE_CANNOT_CLAIM_IMA_MATCH\")\n        if any(row.get(\"ima_provenance\") not in (None, \"unverified\") for row in refs):\n            raise ValueError(\"LOCAL_SOURCE_CANNOT_CLAIM_IMA_MATCH\")\n        if any(row.get(\"verification_state\") == \"source_original_matched_fact_truth_not_asserted\" for row in facts):\n            raise ValueError(\"LOCAL_SOURCE_CANNOT_CLAIM_IMA_MATCH\")\n        return projected\n    receipt = context.get(\"ima_verification\")\n    receipt_keys = {\"schema_version\", \"scope\", \"source_document_ref\", \"source_context_ref\", \"product_ref\",\n                    \"scope_hash\", \"task_hash\", \"snapshot_ref\", \"sha256\", \"byte_length\", \"verified_at\", \"expires_at\",\n                    \"mapping_hash\", \"matched_file_count\", \"all_library_verified\", \"fact_truth_verified\",\n                    \"image_rights_verified\", \"p4_rules_verified\", \"competition_verified\"}\n    if not isinstance(receipt, dict) or set(receipt) != receipt_keys:\n        raise ValueError(\"IMA_FACT_RECEIPT_SCHEMA_INVALID\")\n    if receipt[\"schema_version\"] != \"1.0\" or receipt[\"scope\"] != \"selected_fact_file_only\" or type(receipt[\"matched_file_count\"]) is not int or receipt[\"matched_file_count\"] != 1:\n        raise ValueError(\"IMA_FACT_RECEIPT_SCOPE_INVALID\")\n    for key in (\"all_library_verified\", \"fact_truth_verified\", \"image_rights_verified\", \"p4_rules_verified\", \"competition_verified\"):\n        if receipt[key] is not False:\n            raise ValueError(\"IMA_FACT_RECEIPT_AUTHORITY_INVALID\")\n    for key in (\"source_document_ref\", \"scope_hash\", \"task_hash\", \"sha256\", \"mapping_hash\"):\n        if not isinstance(receipt[key], str) or not re.fullmatch(r\"[0-9a-f]{64}\", receipt[key]):\n            raise ValueError(\"IMA_FACT_RECEIPT_HASH_INVALID\")\n    for key in (\"source_context_ref\", \"product_ref\", \"snapshot_ref\"):\n        if not isinstance(receipt[key], str) or not re.fullmatch(r\"[A-Za-z0-9_][A-Za-z0-9_.:-]{0,255}\", receipt[key]):\n            raise ValueError(\"IMA_FACT_RECEIPT_REFERENCE_INVALID\")\n    if receipt[\"source_context_ref\"] != context[\"source_context_ref\"] or receipt[\"snapshot_ref\"] != context[\"source_snapshot_ref\"]:\n        raise ValueError(\"IMA_FACT_RECEIPT_CONTEXT_BINDING_INVALID\")\n    task = bundle.get(\"task\")\n    if not isinstance(task, dict):\n        raise ValueError(\"IMA_FACT_RECEIPT_TASK_REQUIRED\")\n    task_hash = hashlib.sha256(json.dumps(task, ensure_ascii=False, sort_keys=True, separators=(\",\", \":\"), allow_nan=False).encode(\"utf-8\")).hexdigest()\n    if receipt[\"task_hash\"] != task_hash:\n        raise ValueError(\"IMA_FACT_RECEIPT_TASK_BINDING_INVALID\")\n    if type(receipt[\"byte_length\"]) is not int or not 1 <= receipt[\"byte_length\"] <= 4 * 1024 * 1024:\n        raise ValueError(\"IMA_FACT_RECEIPT_LENGTH_INVALID\")\n    verified, expires = receipt[\"verified_at\"], receipt[\"expires_at\"]\n    if any(type(value) not in (int, float) or not math.isfinite(value) or value < 0 for value in (verified, expires)):\n        raise ValueError(\"IMA_FACT_RECEIPT_TIME_INVALID\")\n    now = time.time()\n    if not verified <= now < expires <= verified + 900:\n        raise ValueError(\"IMA_FACT_RECEIPT_EXPIRED_OR_FUTURE\")\n    document_id = \"document_\" + receipt[\"source_document_ref\"][:24]\n    if context.get(\"ima_provenance\") != provenance:\n        raise ValueError(\"IMA_FACT_RECEIPT_PROVENANCE_INVALID\")\n    if any(row.get(\"document_id\") != document_id or row.get(\"content_hash\") != receipt[\"sha256\"] or row.get(\"ima_provenance\") != provenance for row in refs):\n        raise ValueError(\"IMA_FACT_RECEIPT_DOCUMENT_BINDING_INVALID\")\n    if any(row.get(\"product_ref\") != receipt[\"product_ref\"] or row.get(\"verification_state\") != \"source_original_matched_fact_truth_not_asserted\" for row in facts):\n        raise ValueError(\"IMA_FACT_RECEIPT_PRODUCT_BINDING_INVALID\")\n    projected[\"ima_provenance\"] = provenance\n    # Never pass through unknown keys, nested server metadata, access URLs or\n    # proofs. All values in this exact schema have been checked as safe scalars.\n    projected[\"ima_verification\"] = {key: receipt[key] for key in sorted(receipt_keys)}\n    return projected\n\ndef content_cells(value, prefix=\"/content\"):\n    skip = {\"type\", \"block_id\", \"claim_ids\", \"fact_ids\", \"business_rule_ids\", \"source_ref_id\"}\n    cells = {}\n    if isinstance(value, dict):\n        for key, item in value.items():\n            if key not in skip:\n                escaped = key.replace(\"~\", \"~0\").replace(\"/\", \"~1\")\n                cells.update(content_cells(item, prefix + \"/\" + escaped))\n    elif isinstance(value, list):\n        for index, item in enumerate(value):\n            cells.update(content_cells(item, prefix + \"/\" + str(index)))\n    elif isinstance(value, str) and value.strip():\n        cells[prefix] = value\n    return cells\n\ndef validated_draft(bundle, raw):\n    draft = strict_json(raw)\n    if draft.get(\"status\") != \"ready\" or draft.get(\"blockers\"):\n        raise ValueError(\"WRITER_NOT_READY\")\n    for key in (\"claims\", \"knowledge_basis\", \"image_plan\", \"open_questions\", \"blockers\"):\n        if not isinstance(draft.get(key), list):\n            raise ValueError(\"DRAFT_ARRAY_REQUIRED\")\n    if not isinstance(draft.get(\"scenario_judgment\"), dict) or (\"strategy\" in draft and not isinstance(draft[\"strategy\"], dict)):\n        raise ValueError(\"DRAFT_CONTEXT_REQUIRED\")\n    content = draft.get(\"content\")\n    if not isinstance(content, dict) or content.get(\"type\") != \"product_intro\":\n        raise ValueError(\"MINIMAL_ROUTE_PRODUCT_INTRO_ONLY\")\n    if draft[\"image_plan\"]:\n        raise ValueError(\"MINIMAL_ROUTE_DOES_NOT_VERIFY_IMAGES\")\n    facts, sources, rules = reference_sets(bundle)\n    if not facts or not sources or not draft[\"claims\"] or not draft[\"knowledge_basis\"]:\n        raise ValueError(\"EMPTY_EVIDENCE_OR_CLAIMS\")\n    for row in draft[\"knowledge_basis\"]:\n        if not isinstance(row, dict) or row.get(\"source_ref_id\") not in sources:\n            raise ValueError(\"UNKNOWN_SOURCE_REF\")\n    cells = content_cells(content)\n    if not cells:\n        raise ValueError(\"EMPTY_CONTENT\")\n    claim_ids = set()\n    for claim in draft[\"claims\"]:\n        if not isinstance(claim, dict):\n            raise ValueError(\"INVALID_CLAIM\")\n        claim_id = claim.get(\"claim_id\")\n        target, text = claim.get(\"target\"), claim.get(\"text\")\n        if not isinstance(claim_id, str) or not claim_id or claim_id in claim_ids:\n            raise ValueError(\"INVALID_CLAIM_ID\")\n        claim_ids.add(claim_id)\n        if claim.get(\"quote_binding\") is not None:\n            raise ValueError(\"MINIMAL_ROUTE_MUST_NOT_INCLUDE_QUOTE_BINDING\")\n        if target not in cells or not isinstance(text, str) or not text or text not in cells[target]:\n            raise ValueError(\"CLAIM_POINTER_OR_TEXT_MISMATCH\")\n        fact_ids, rule_ids = claim.get(\"fact_ids\", []), claim.get(\"business_rule_ids\", [])\n        if not isinstance(fact_ids, list) or not isinstance(rule_ids, list) or not (fact_ids or rule_ids):\n            raise ValueError(\"CLAIM_SUPPORT_REQUIRED\")\n        if not set(fact_ids) <= facts or not set(rule_ids) <= rules:\n            raise ValueError(\"UNKNOWN_FACT_OR_RULE_REF\")\n    return draft, cells\n\ndef preliminary_strategy(task):\n    channel = task.get(\"content_channel\")\n    platforms = {\n        \"wechat_article\": {\"image_count_range\": [2, 4], \"structure\": [\"标题\", \"导语\", \"分段正文\", \"行动引导\"], \"tone\": \"解释清楚、证据与限制并列\"},\n        \"xiaohongshu\": {\"image_count_range\": [3, 6], \"structure\": [\"口语标题\", \"场景短段落\", \"核对清单\", \"话题标签\", \"一次互动\"], \"tone\": \"自然具体、不虚构个人体验\"},\n        \"moments\": {\"image_count_range\": [1, 3], \"structure\": [\"人群任务首句\", \"一个核心卖点\", \"必要条件\", \"一次行动引导\"], \"tone\": \"克制、简短、低打扰\"},\n        \"store_poster\": {\"image_count_range\": [1, 1], \"structure\": [\"主标题\", \"副标题\", \"至多三个卖点\", \"有据活动或条件\", \"一次行动引导\"], \"tone\": \"短句、清楚层级\"},\n    }\n    if channel is not None and channel not in platforms:\n        raise ValueError(\"PRELIMINARY_CHANNEL_INVALID\")\n    return {\"stage\": \"pre_retrieval_intent_only\", \"product_capabilities_asserted\": False,\n            \"facts_verified\": False, \"platform\": channel,\n            \"task_dimensions\": {k: task.get(k) for k in (\"audience\", \"usage_scenario\", \"purchase_stage\", \"problem\", \"content_goal\")},\n            \"editorial_intent\": platforms.get(channel),\n            \"retrieval_targets\": [\"准确型号和相关配置\", \"当前任务相关事实及限制\", \"匹配型号的ima图片及来源\"] if channel else [\"准确型号和相关配置\", \"当前任务相关事实及限制\"],\n            \"dynamic_price_rules_required\": task.get(\"quote_required\") is True,\n            \"next_step\": \"取证后才能选择具体卖点、图片及冻结平台策略\"}\n\nimport re\n\ndef done(payload=None, scope_ref=\"\", proof=\"\", message=\"\"):\n    return {\"ready\": True, \"payload_json\": dump(payload or {}), \"scope_ref\": scope_ref, \"proof\": proof, \"message\": message}\n\ndef stop(code):\n    return {\"ready\": False, \"payload_json\": \"{}\", \"scope_ref\": \"\", \"proof\": \"\", \"message\": \"阶段开发已阻断：\" + code + \"。未生成营销成稿，未放行导出。\"}\n\ndef stage_task(task):\n    if (not isinstance(task, dict) or task.get(\"task_kind\") != \"marketing\" or task.get(\"delivery_scope\") != \"content_only\"\n            or any(task.get(k) is not False for k in (\"quote_required\", \"purchase_plan_required\", \"script_required\"))\n            or task.get(\"content_channel\") not in {\"wechat_article\", \"xiaohongshu\", \"moments\", \"store_poster\"}):\n        raise ValueError(\"EXPLICIT_UNPRICED_MARKETING_REQUIRED\")\n    return task\n\ndef required_nodes(task):\n    return {\"platform_strategy\", \"fact_compliance_review\", \"visual_layout\", \"visual_review\",\n            \"poster_copy\" if task[\"content_channel\"] == \"store_poster\" else \"article_write\"}\n\ndef stage_policy(policy, task, purpose=None, destination=None, expected=None):\n    if not isinstance(policy, dict) or type(policy.get(\"llm_payload_allowed\")) is not bool:\n        raise ValueError(\"FULL_POLICY_REQUIRED\")\n    nodes = policy.get(\"required_model_nodes\")\n    if not isinstance(nodes, list) or any(not isinstance(k, str) for k in nodes) or len(nodes) != len(set(nodes)) or set(nodes) != required_nodes(task):\n        raise ValueError(\"FULL_CHAIN_REQUIREMENTS_MUST_REMAIN\")\n    auth = policy.get(\"stage_authorization\")\n    keys = {\"stage\", \"allowed\", \"current_model_nodes\", \"purpose_ref\", \"destination_ref\", \"region\", \"development_only\", \"export_allowed\", \"competition_eligible\"}\n    if (not isinstance(auth, dict) or set(auth) != keys or auth.get(\"stage\") != \"platform_strategy\"\n            or auth.get(\"allowed\") is not True or auth.get(\"current_model_nodes\") != [\"platform_strategy\"]\n            or auth.get(\"development_only\") is not True or auth.get(\"export_allowed\") is not False\n            or auth.get(\"competition_eligible\") is not False):\n        raise ValueError(\"SERVER_STAGE_AUTHORIZATION_REQUIRED\")\n    if any(not isinstance(auth.get(k), str) or not auth[k].strip() or len(auth[k]) > 256 for k in (\"purpose_ref\", \"destination_ref\", \"region\")):\n        raise ValueError(\"STAGE_DISCLOSURE_SCOPE_REQUIRED\")\n    if purpose is not None and auth[\"purpose_ref\"] != purpose or destination is not None and auth[\"destination_ref\"] != destination:\n        raise ValueError(\"STAGE_PURPOSE_MISMATCH\")\n    grants = policy.get(\"allowed_model_destinations\")\n    if not isinstance(grants, list):\n        raise ValueError(\"ACTUAL_STAGE_GRANT_REQUIRED\")\n    selected = []\n    for grant in grants:\n        if not isinstance(grant, dict) or grant.get(\"node_id\") != \"platform_strategy\":\n            continue\n        fields = {\"node_id\", \"provider\", \"model\", \"purpose_ref\", \"destination_ref\", \"region\"}\n        if set(grant) != fields or any(not isinstance(grant.get(k), str) or not grant[k].strip() or len(grant[k]) > 256 for k in fields):\n            raise ValueError(\"STAGE_GRANT_SHAPE_INVALID\")\n        if all(grant[k] == auth[k] for k in (\"purpose_ref\", \"destination_ref\", \"region\")):\n            if expected is None or all(grant[k] == expected[k] for k in (\"node_id\", \"provider\", \"model\")):\n                selected.append(dict(grant))\n    if len(selected) != 1:\n        raise ValueError(\"EXACT_STAGE_DESTINATION_NOT_APPROVED\")\n    # Keep full-chain status unchanged. Only the current grant goes to the LLM.\n    return {\"llm_payload_allowed\": policy[\"llm_payload_allowed\"], \"required_model_nodes\": list(nodes),\n            \"allowed_model_destinations\": selected, \"stage_authorization\": dict(auth),\n            \"source_mode\": \"local_snapshot\", \"competition_eligible\": False, \"export_allowed\": False,\n            \"development_single_user_only\": True, \"multi_store_authorization_implemented\": False}\n\ndef no_private(value):\n    forbidden = {\"api_key\", \"apikey\", \"client_id\", \"authorization\", \"source_context_proof\", \"signed_url\", \"raw_p4\", \"raw_rules\", \"secret\", \"password\", \"filesystem_path\"}\n    if isinstance(value, dict):\n        if any(str(k).lower() in forbidden for k in value): raise ValueError(\"PRIVATE_METADATA_FORBIDDEN\")\n        for item in value.values(): no_private(item)\n    elif isinstance(value, list):\n        for item in value: no_private(item)\n\ndef text(value, *, blank=False):\n    if not isinstance(value, str) or len(value) > 6000 or (not blank and not value.strip()):\n        raise ValueError(\"STRATEGY_TEXT_INVALID\")\n    if re.search(r\"https?://|file:|/Users/|/etc/|Bearer\\s|api[_ -]?key|client[_ -]?id|签名下载|[¥￥$€]|(?<![A-Za-z])(?:CNY|RMB|USD)\\s*\\d|\\d[\\d,.]*\\s*(?:元|折)\", value, re.I):\n        raise ValueError(\"STRATEGY_PRIVATE_URL_OR_AMOUNT_FORBIDDEN\")\n    return value\n\nEXPECTED = {'node_id': 'platform_strategy', 'provider': 'langgenius/deepseek/deepseek', 'model': 'deepseek-flash'}\ndef main(status_code: int, body: str, request_json: str, scope_ref: str) -> dict:\n    try:\n        data = business_response(status_code, body)\n        request = strict_json(request_json)\n        original = stage_task(request[\"task\"])\n        bundle = data.get(\"task_bundle\")\n        if not isinstance(bundle, dict): return stop(\"STAGE_EVIDENCE_REQUIRED\")\n        task = stage_task(bundle.get(\"task\"))\n        if any(task.get(k) != v for k, v in original.items()): return stop(\"BOUND_TASK_CHANGED\")\n        context = bundle.get(\"trusted_context\")\n        if (not isinstance(context, dict) or context.get(\"source_context_ref\") != scope_ref\n                or context.get(\"source_mode\") != \"local_snapshot\" or not context.get(\"source_snapshot_ref\")\n                or context.get(\"development_stage\") != \"platform_strategy\" or context.get(\"export_allowed\") is not False\n                or context.get(\"competition_eligible\") is not False or context.get(\"ima_provenance\", \"unverified\") != \"unverified\"\n                or context.get(\"ima_verification\") is not None):\n            return stop(\"LOCAL_CONTEXT_REQUIRED\")\n        policy = stage_policy(bundle.get(\"policy\"), task, request[\"purpose_ref\"], request[\"destination_ref\"], EXPECTED)\n        evidence = bundle.get(\"evidence\")\n        if not isinstance(evidence, dict) or evidence.get(\"business_rules\") != [] or bundle.get(\"unresolved_conflicts\"):\n            return stop(\"FACTS_CONFLICT_OR_BUSINESS_RULES_FORBIDDEN\")\n        facts, refs = evidence.get(\"facts\"), evidence.get(\"source_refs\")\n        if not isinstance(facts, list) or not facts or len(facts) > 100 or not isinstance(refs, list) or not refs or len(refs) > 200:\n            return stop(\"BOUNDED_FACTS_REQUIRED\")\n        source_ids = [r.get(\"source_ref_id\") for r in refs if isinstance(r, dict)]\n        if len(source_ids) != len(refs) or len(set(source_ids)) != len(refs) or any(not isinstance(k, str) or not k for k in source_ids):\n            return stop(\"SOURCE_REFERENCE_INVALID\")\n        approved_refs = []\n        for row in refs:\n            if not isinstance(row.get(\"content_hash\"), str) or not row[\"content_hash\"] or not isinstance(row.get(\"source_title\"), str) or not row[\"source_title\"].strip():\n                return stop(\"SOURCE_TITLE_AND_HASH_REQUIRED\")\n            approved_refs.append({k: row[k] for k in (\"source_ref_id\", \"source_title\", \"content_hash\")})\n        approved_facts, ids = [], set()\n        for row in facts:\n            if not isinstance(row, dict) or not isinstance(row.get(\"fact_id\"), str) or not row[\"fact_id\"] or row[\"fact_id\"] in ids:\n                return stop(\"FACT_REFERENCE_INVALID\")\n            links = row.get(\"source_ref_ids\")\n            if not isinstance(links, list) or not links or not set(links) <= set(source_ids): return stop(\"FACT_SOURCE_BINDING_INVALID\")\n            for key in (\"product_ref\", \"product_display_name\", \"field_name\", \"raw_value\"):\n                if not isinstance(row.get(key), str) or not row[key].strip(): return stop(\"FACT_VALUE_REQUIRED\")\n            if row.get(\"verification_state\") != \"local_source_claim_only\": return stop(\"LOCAL_FACT_CANNOT_CLAIM_IMA\")\n            conditions = row.get(\"conditions\")\n            if not isinstance(conditions, list) or any(not isinstance(c, str) for c in conditions): return stop(\"FACT_CONDITIONS_REQUIRED\")\n            ids.add(row[\"fact_id\"])\n            approved_facts.append({k: row[k] for k in (\"fact_id\", \"product_ref\", \"product_display_name\", \"field_name\", \"raw_value\", \"source_ref_ids\", \"conditions\", \"verification_state\")})\n        projected = {\"trusted_context\": {\"source_context_ref\": scope_ref, \"source_mode\": \"local_snapshot\", \"source_snapshot_ref\": context[\"source_snapshot_ref\"],\n                      \"ima_provenance\": \"unverified\", \"competition_eligible\": False, \"development_single_user_only\": True},\n                     \"task\": task, \"evidence\": {\"facts\": approved_facts, \"source_refs\": approved_refs, \"business_rules\": []},\n                     \"allowed_assets\": [], \"policy\": policy, \"retrieval_intent\": preliminary_strategy(task),\n                     \"quote_context\": {\"quote_required\": False, \"purchase_plan_required\": False, \"quote_status\": None, \"client_quote_allowed\": False, \"customer_quote_summary\": None},\n                     \"development_stage\": {\"stage\": \"platform_strategy\", \"stage_only\": True, \"independent_review_performed\": False,\n                       \"content_delivery_allowed\": False, \"export_allowed\": False, \"competition_eligible\": False,\n                       \"notice\": \"仅本地开发策略候选；ima来源与图片尚未核验，不生成成稿，不放行导出。\"}}\n        no_private(projected)\n        return done(projected)\n    except (ValueError, TypeError, KeyError):\n        return stop(\"STAGE_EVIDENCE_OR_AUTHORIZATION_INVALID\")\n",
